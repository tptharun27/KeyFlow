[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyflow"
version = "1.1.0"
description = "Remote typing control from your phone to your PC via Wi-Fi."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Flask>=2.0.0",
    "pynput>=1.7.0",
    "qrcode>=7.0.0",
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
]

[project.scripts]
keyflow = "keyflow:main"
